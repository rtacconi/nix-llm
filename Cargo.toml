[workspace]
resolver = "3"
members = ["crates/nsbx-proto", "crates/nsbx-policy", "crates/nsbx-core", "crates/nsbx-pyo3"]
# The Python binding needs a Python 3.12 interpreter to build; it is built by
# Nix (maturin) and is left out of plain `cargo build` / `cargo test`.
default-members = ["crates/nsbx-proto", "crates/nsbx-policy", "crates/nsbx-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["serde"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
panic = "abort"
